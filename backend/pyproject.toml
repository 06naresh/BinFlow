
[project]
name = "binflow-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "email-validator==2.3.0",
    "fastapi==0.162.7",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.9",
    "pydantic-settings==2.16.3",
    "python-dotenv==1.2.4",
    "PyYAML==6.0.3",
    "SQLAlchemy==2.1.8",
    "uvicorn==0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
